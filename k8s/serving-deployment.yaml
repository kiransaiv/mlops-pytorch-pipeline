apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: serve
          image: mlops-serve:v1
          # Built locally and shared via Docker Desktop's own image store
          # (Kubeadm cluster type) - no registry push needed for this setup.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: checkpoints-volume
              mountPath: /app/checkpoints
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            initialDelaySeconds: 15
      volumes:
        - name: checkpoints-volume
          persistentVolumeClaim:
            # Same PVC the training Job wrote to (see k8s/training-job.yaml)
            claimName: training-checkpoints-pvc
            readOnly: true
