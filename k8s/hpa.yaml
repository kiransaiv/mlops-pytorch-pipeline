# Note: CPU-based autoscaling requires the metrics-server add-on. Docker
# Desktop's Kubeadm cluster doesn't ship it by default, so `kubectl get hpa`
# may show TARGETS as <unknown>/70% until metrics-server is installed. The
# HPA object itself still applies and is valid either way.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-serving-hpa
  namespace: ml-training
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
